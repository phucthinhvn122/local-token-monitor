name: Bug report
description: Report a reproducible, privacy-safe defect
body:
  - type: markdown
    attributes:
      value: Never attach real prompts, credentials, source code, or session logs.
  - type: input
    id: version
    attributes:
      label: Local Token Monitor version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, macOS, Linux, WSL]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction steps
    validations:
      required: true
