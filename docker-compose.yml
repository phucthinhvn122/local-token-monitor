# Codex Gateway — single-host deployment.
#
# Only the web app is published. The gateway is reachable from the browser
# through the Next.js `/api/*` rewrite, and Postgres is never exposed.
#
# To let Codex CLI reach the gateway directly (which it must), either publish
# the gateway port as well or — recommended — terminate TLS in front of both
# with the `caddy` profile below.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-codex_gateway}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codex} -d ${POSTGRES_DB:-codex_gateway}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-http://localhost:4000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      STRICT_ONE_TIME_KEYS: ${STRICT_ONE_TIME_KEYS:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      PORT: "4000"
    ports:
      # Codex CLI talks to this directly. Behind the caddy profile you can
      # drop this mapping and let the reverse proxy own the public surface.
      - "${GATEWAY_PORT:-4000}:4000"
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      GATEWAY_INTERNAL_URL: http://gateway:4000
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks: [internal]

  # Optional TLS terminator. Enable with:  docker compose --profile tls up -d
  caddy:
    image: caddy:2-alpine
    profiles: [tls]
    restart: unless-stopped
    depends_on: [web, gateway]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

  # Nightly pg_dump into ./docker/backup, keeping the last 14 files.
  # Enable with:  docker compose --profile backup up -d
  backup:
    image: postgres:17-alpine
    profiles: [backup]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./docker/backup:/backup
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          STAMP=$$(date +%Y%m%d-%H%M%S)
          echo "[backup] dumping to /backup/codex-gateway-$$STAMP.sql.gz"
          pg_dump -h postgres -U "${POSTGRES_USER:-codex}" -d "${POSTGRES_DB:-codex_gateway}" \
            | gzip > "/backup/codex-gateway-$$STAMP.sql.gz" || echo "[backup] dump failed"
          ls -1t /backup/codex-gateway-*.sql.gz 2>/dev/null | tail -n +15 | xargs -r rm --
          sleep 86400
        done
    networks: [internal]

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
